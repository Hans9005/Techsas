<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <title>Techsas - Main</title>
</head>
<body>
    
    <div class="backdrop" aria-hidden="true">
        <span class="background-word background-word--top">TECHSAS</span>
        <span class="background-word background-word--left">TECHSAS</span>
        <img class="squiggle squiggle--one" src="images/curve.svg" alt="">
        <img class="squiggle squiggle--two" src="images/curve.svg" alt="">
        <img class="squiggle squiggle--three" src="images/wave.svg" alt="">
        <img class="squiggle squiggle--four" src="images/wave.svg" alt="">
        <span class="background-star">★</span>
    </div>

    <div class="site-shell">
        
        <header class="site-header">
            <a class="brand" href="index.html" aria-label="Techsas home">
                <span class="brand-name">Techsas</span>
                <span class="brand-tagline">(like Texas but Techsas, <small>you know</small>)</span>
            </a>
            <nav class="account-nav" aria-label="Account">
                <button type="button">Login</button>
                <button type="button">Sign up</button>
            </nav>
        </header>

        <main class="main-panel">
            
            <nav class="side-actions" aria-label="Browse">
                <button class="blue-button" type="button" aria-label="Popular"></button>
                
            </nav>

            
            <section class="catalog">
                <h1 id="catalog-title">Popular</h1>
                <div class="card-grid">
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                    <div class="card"></div>
                </div>
            </section>

            <button class="blue-button back-to-top" type="button" aria-label="Back to top"></button>
        </main>
    </div>

    <script src="script.js" defer></script>   
</body>
</html>
